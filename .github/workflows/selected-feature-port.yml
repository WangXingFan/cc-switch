name: Selected Feature Port

on:
  push:
    branches: [feat/selected-upstream-features-20261125]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selected-feature-port-${{ github.sha }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v5
        with:
          version: 10.12.3
      - run: pnpm install --no-frozen-lockfile
      - name: Format imported frontend code
        run: pnpm exec prettier --write "src/**/*.{js,jsx,ts,tsx,css,json}" "tests/**/*.{ts,tsx}" tailwind.config.cjs
      - name: TypeScript
        id: types
        continue-on-error: true
        run: pnpm typecheck
      - name: Frontend tests
        id: tests
        continue-on-error: true
        run: pnpm test:unit
      - name: Frontend build
        id: build
        continue-on-error: true
        run: pnpm build:renderer
      - uses: actions/upload-artifact@v7
        if: steps.build.outcome == 'success'
        with:
          name: renderer-preview
          path: dist
      - name: Render feature previews
        id: preview
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          UI_PREVIEW_TOOLS: ${{ runner.temp }}/feature-preview
        run: |
          npm install --prefix "$UI_PREVIEW_TOOLS" playwright@1.56.1
          "$UI_PREVIEW_TOOLS/node_modules/.bin/playwright" install --with-deps chromium
          node .github/scripts/selected-feature-preview.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-preview
          path: ui-preview
      - name: Save formatting and dependency changes
        if: always()
        run: git diff --binary > frontend-generated.patch
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-generated
          path: frontend-generated.patch
      - name: Require frontend checks
        if: always()
        env:
          TYPES: ${{ steps.types.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
          PREVIEW: ${{ steps.preview.outcome }}
        run: test "$TYPES" = success && test "$TESTS" = success && test "$BUILD" = success && test "$PREVIEW" = success

  backend:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Prepare frontend placeholder
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path dist | Out-Null
      - name: Format imported Rust code
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Clippy
        id: clippy
        continue-on-error: true
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Backend tests
        id: tests
        continue-on-error: true
        run: cargo test --no-fail-fast --manifest-path src-tauri/Cargo.toml
      - name: Save formatting and dependency changes
        if: always()
        shell: bash
        run: git diff --binary > backend-generated.patch
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-generated
          path: backend-generated.patch
      - name: Require backend checks
        if: always()
        shell: pwsh
        env:
          CLIPPY: ${{ steps.clippy.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          if ($env:CLIPPY -ne 'success' -or $env:TESTS -ne 'success') { exit 1 }
