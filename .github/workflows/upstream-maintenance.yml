name: Upstream Maintenance

on:
  push:
    branches: [feat/upstream-maintenance-20261127]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v5
        with:
          version: 10.12.3
      - run: pnpm install --no-frozen-lockfile
      - name: Format imported frontend code
        run: pnpm exec prettier --write "src/**/*.{js,jsx,ts,tsx,css,json}" "tests/**/*.{ts,tsx}" tailwind.config.cjs
      - name: TypeScript
        id: types
        continue-on-error: true
        run: pnpm typecheck
      - name: Frontend tests
        id: tests
        continue-on-error: true
        run: pnpm test:unit
      - name: Frontend build
        id: build
        continue-on-error: true
        run: pnpm build:renderer
      - uses: actions/upload-artifact@v7
        if: steps.build.outcome == 'success'
        with:
          name: renderer-preview
          path: dist
      - name: Save formatting and dependency changes
        if: always()
        run: git diff --binary > frontend-generated.patch
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-generated
          path: frontend-generated.patch
      - name: Require frontend checks
        if: always()
        env:
          TYPES: ${{ steps.types.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: test "$TYPES" = success && test "$TESTS" = success && test "$BUILD" = success

  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Prepare frontend placeholder
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path dist | Out-Null
      - name: Format imported Rust code
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Clippy
        id: clippy
        continue-on-error: true
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Backend tests
        id: tests
        continue-on-error: true
        run: cargo test --no-fail-fast --manifest-path src-tauri/Cargo.toml
      - name: Save formatting and dependency changes
        if: always()
        shell: bash
        run: git diff --binary > backend-generated.patch
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-generated-${{ runner.os }}
          path: backend-generated.patch
      - name: Require backend checks
        if: always()
        shell: pwsh
        env:
          CLIPPY: ${{ steps.clippy.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          if ($env:CLIPPY -ne 'success' -or $env:TESTS -ne 'success') { exit 1 }
